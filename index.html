<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Playwright x Element Plus recipes</title>
    <script>
      // Set the theme before the first paint. Same rule as src/prefs.ts:
      // a stored choice wins, otherwise follow the system.
      var t = null
      try {
        t = localStorage.getItem('ep-recipes:theme')
      } catch (e) {}
      var dark = t ? t === 'dark' : !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches)
      if (dark) document.documentElement.classList.add('dark')
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
