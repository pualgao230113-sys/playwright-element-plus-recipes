name: release

# Publishes packages/playwright-element-plus to npm when a tag like v0.1.0 is
# pushed. Uses npm Trusted Publishing (OIDC), so there is no NPM_TOKEN secret.
# The package must have this repo and workflow set as its trusted publisher
# on npmjs.com.

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./packages/playwright-element-plus/package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version $pkg"
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME matches package version $pkg"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm install --no-save element-plus@2.14.7
      - run: npx playwright install --with-deps chromium

      - run: npm run typecheck
      - run: npm run build
      - run: npm run build:helpers

      - name: Playwright tests
        run: npx playwright test --reporter=list,html
        env:
          CI: 'true'

      - name: Upload HTML report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-release
          path: playwright-report/
          retention-days: 14

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted Publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@^11.5.1
      - run: npm --version

      - run: npm ci

      - name: Publish
        working-directory: packages/playwright-element-plus
        run: npm publish --provenance --access public
